name: fyp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^1.1.6
  fl_chart: ^1.1.1

  # Permissions
  permission_handler: ^12.0.1
  geolocator: ^13.0.1

  # Audio
  record: ^6.1.2
  audioplayers: ^6.5.1
  flutter_ringtone_player: ^4.0.0+4

  # Storage
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.0.7

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  intl: ^0.20.2
  http: ^1.1.0
  url_launcher: ^6.3.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.0.0
  google_sign_in: ^6.1.0
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

  provider: ^6.0.5
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Real alarm clock — rings even when the app is killed
  alarm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/destinations/
    # ⚠️  Place any alarm sound here (e.g. rename any .mp3 to alarm.mp3)
    # Download a free alarm sound from freesound.org or similar.
    - assets/alarm.mp3
