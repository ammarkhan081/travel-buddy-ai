services:
  - type: web
    name: travel-buddy-ai-backend
    runtime: docker
    plan: free
    branch: codex/cloud-deployment
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    dockerCommand: >
      sh -c "cd /app/backend &&
      alembic -c alembic.ini upgrade head &&
      cd /app &&
      uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: AUTH_BYPASS
        value: false
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: WHISPER_MODEL
        value: whisper-1
      - key: MAX_AUDIO_DURATION
        value: 300
      - key: ALLOWED_ORIGINS
        value: https://travel-buddy-ai-backend.onrender.com
